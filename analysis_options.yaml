include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/app_localizations*.dart
    - lib/data/db/schema_versions.dart
  errors:
    # freezed + json_serializable put @JsonKey on constructor parameters.
    invalid_annotation_target: ignore

linter:
  rules:
    # App code, not a published package.
    public_member_api_docs: false
    # dart format decides line length.
    lines_longer_than_80_chars: false

formatter:
  page_width: 120
